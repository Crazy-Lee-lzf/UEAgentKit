[project]
name = "ue-agent-kit"
version = "0.2.3"
description = "Open-source AI tooling for inspecting, indexing, editing, validating, and automating Unreal Engine projects."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = []

[tool.ue-agent-kit]
canonical-schema-version = "1.1"
bpctx-version = "1"
minimum-unreal-version = "5.6"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
