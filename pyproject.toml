[project]
name = "blueprint-context-tool"
version = "0.1.0"
description = "UE5 Blueprint inspection, indexing, and safe modification foundation for AI development tools."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.blueprint-context-tool]
canonical-schema-version = "1.0"
bpctx-version = "1"
minimum-unreal-version = "5.6"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
