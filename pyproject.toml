[project]
name = "ue-agent-kit"
version = "0.3.0"
description = "Open-source Unreal Engine asset catalog and Blueprint semantic indexing toolkit for developers and AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = []

[tool.ue-agent-kit]
canonical-schema-version = "1.1"
bpctx-version = "1"
minimum-unreal-version = "5.6"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
