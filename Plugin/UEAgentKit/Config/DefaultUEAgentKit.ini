; UEAgentKit native tooling configuration.
;
; NativeToolRegistry:
;   off    (default) legacy P12 only; no manifest read, no native tools.
;   shadow          manifest is loaded and native tools are reachable through
;                   native.invoke, but nothing is exposed to MCP or menus.
;   active          reserved; R1 never enables write/Apply surfaces.
;
; The value is read once at module startup.  MCP/tool arguments can never
; change it (N0-D01, N0 12.9).
[UEAgentKit]
NativeToolRegistry=off
