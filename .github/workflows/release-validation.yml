name: Release validation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp,dev]"

      - name: Run release validation
        run: python scripts/ValidateRelease.py --require-release-docs

      - name: Build Python distribution
        run: python -m build --outdir dist

      - name: Upload Python distribution
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: ue-agent-kit-python
          path: dist/*
          if-no-files-found: error
          retention-days: 14
